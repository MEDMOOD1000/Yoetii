name: mornye
description: Reusable application shell based on Mornye's themes and navigation
publish_to: none
version: 0.2.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  dynamic_color: ^2.1.0
  material_ui: ^1.9.0
  material_3_expressive: ^1.2.0
  material_symbols_icons: ^4.2960.0
  liquid_glass_easy: 5.1.0
  file_picker: ^13.3.0
  crypto: ^3.0.8
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  shaders:
    - assets/shaders/mornye_selection_mask.frag
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
